name: LPMS CI/CD Pipeline

on:
  push:
    branches: ["main", "test", "dev", "Feature-ci-deploy"]
  pull_request:
    branches: ["main", "test", "dev", "Feature-ci-deploy"]

jobs:
  client-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Fix ESLint Version for Legacy Config
        # ESLint 8 is required for .eslintrc.cjs — avoids permanent file changes
        run: npm install eslint@8.57.0 --no-save --legacy-peer-deps

      - name: Run Linter
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

  server-ci:
    name: Backend CI (Express + Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lpms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/lpms_db
      SECRET_KEY: test-secret

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Database Migrations
        run: npm run migrate

      - name: Run Unit Tests
        run: npm test

  deploy-test:
    name: Deploy to Server Test
    runs-on: ubuntu-latest
    needs: [client-ci, server-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/Feature-ci-deploy'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_DB_URL: ${{ secrets.PROD_DATABASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: PROD_DB_URL
          script: |
            cd ~/LPMS
            git fetch origin
            git checkout Feature-ci-deploy
            git pull origin Feature-ci-deploy

            cd client
            npm install --legacy-peer-deps
            npm run build
            cp -r dist/* /var/www/lpms-client/

            cd ../server
            npm install --legacy-peer-deps
            DATABASE_URL=$PROD_DB_URL npm run migrate

            pm2 restart lpms-api

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [client-ci, server-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_DB_URL: ${{ secrets.PROD_DATABASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: PROD_DB_URL
          script: |
            cd ~/LPMS
            git pull origin main

            cd client
            npm install --legacy-peer-deps
            npm run build
            cp -r dist/* /var/www/lpms-client/

            cd ../server
            npm install --legacy-peer-deps
            DATABASE_URL=$PROD_DB_URL npm run migrate

            pm2 restart lpms-api