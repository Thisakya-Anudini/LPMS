name: LPMS CI/CD Pipeline

on:
  push:
    branches: ["main", "test", "dev"]
  pull_request:
    branches: ["main", "test", "dev"]

jobs:
  client-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Fix ESLint Version for Legacy Config
        # This dynamically uses ESLint 8 which supports .eslintrc.cjs
        # It avoids changing any files in your project repository permanently.
        run: npm install eslint@8.57.0 --no-save --legacy-peer-deps

      - name: Run Linter
        run: npm run lint
        # If lint fails, it will fail the build

      - name: Build Production Bundle
        run: npm run build

  server-ci:
    name: Backend CI (Express + Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lpms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/lpms_db
      SECRET_KEY: test-secret # Fallback for JWT signing in tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Database Migrations
        run: npm run migrate
        # Ensures that the database schema is valid and current

      - name: Run Unit Tests
        run: npm test

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [client-ci, server-ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_DB_URL: ${{ secrets.PROD_DATABASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: PROD_DB_URL
          script: |
            # Navigate to the project directory
            cd ~/LPMS
            git pull origin main
            
            # Rebuild and Deploy Frontend
            cd client
            npm install --legacy-peer-deps
            npm run build
            # We assume /var/www/lpms-client is owned by the trainee user (no sudo required)
            cp -r dist/* /var/www/lpms-client/
            
            # Install Backend Dependencies and Restart
            cd ../server
            npm install --legacy-peer-deps
            
            # Safely run database migrations before restarting
            DATABASE_URL=$PROD_DB_URL npm run migrate
            
            pm2 restart lpms-api
