name: LPMS CI/CD Pipeline

on:
  push:
    branches: ["main", "test", "dev", "Feature-ci-deploy"]
  pull_request:
    branches: ["main", "test", "dev", "Feature-ci-deploy"]

# Cancel any in-progress run on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: jobs only get read access unless they declare more
permissions:
  contents: read

jobs:
  client-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install ESLint 8 (required for .eslintrc.cjs)
        run: npm install eslint@8.57.0 --no-save --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  server-ci:
    name: Backend CI (Express + Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lpms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/lpms_db
      SECRET_KEY: test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run migrations
        run: npm run migrate

      - name: Run tests
        run: npm test

  deploy-test:
    name: Deploy (Feature-ci-deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [client-ci, server-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/Feature-ci-deploy'
    environment: staging

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_DB_URL: ${{ secrets.PROD_DATABASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: PROD_DB_URL
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/LPMS
            git fetch origin
            git checkout Feature-ci-deploy
            git pull origin Feature-ci-deploy

            cd client
            npm ci --legacy-peer-deps
            npm run build
            cp -r dist/* /var/www/lpms-client/

            cd ../server
            npm ci --legacy-peer-deps
            DATABASE_URL=$PROD_DB_URL npm run migrate
            pm2 restart lpms-api

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [client-ci, server-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_DB_URL: ${{ secrets.PROD_DATABASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: PROD_DB_URL
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/LPMS
            git pull origin main

            cd client
            npm ci --legacy-peer-deps
            npm run build
            cp -r dist/* /var/www/lpms-client/

            cd ../server
            npm ci --legacy-peer-deps
            DATABASE_URL=$PROD_DB_URL npm run migrate
            pm2 restart lpms-api
