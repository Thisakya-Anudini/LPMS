name: LPMS CI/CD Pipeline

on:
  push:
    branches: ["main", "test", "dev", "Feature-ci-deploy"]
  pull_request:
    branches: ["main", "test", "dev", "Feature-ci-deploy"]

jobs:
  client-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Fix ESLint Version for Legacy Config
        # ESLint 8 is required for .eslintrc.cjs — avoids permanent file changes
        run: npm install eslint@8.57.0 --no-save --legacy-peer-deps

      - name: Run Linter
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

  server-ci:
    name: Backend CI (Express + Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lpms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/lpms_db
      SECRET_KEY: test-secret

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Database Migrations
        run: npm run migrate

      - name: Run Unit Tests
        run: npm test

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [client-ci, server-ci]
    # Only deploy on direct pushes (not PRs), on main or Feature-ci-deploy
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Feature-ci-deploy')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            # Navigate to the app directory — update this path to match your server layout
            APP_DIR=~/lpms
            cd "$APP_DIR"

            # Pull latest code for the triggering branch
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            # Build the React frontend
            cd "$APP_DIR/client"
            npm install --legacy-peer-deps
            npm run build

            # Install server dependencies and run migrations
            cd "$APP_DIR/server"
            npm install --legacy-peer-deps
            npm run migrate

            # Restart (or start) the backend with PM2
            cd "$APP_DIR/server"
            pm2 describe lpms-server > /dev/null 2>&1 \
              && pm2 restart lpms-server \
              || pm2 start index.js --name lpms-server

            pm2 save
